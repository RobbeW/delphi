attention_guidance_animation_specification:
  principle: 'Aandacht sturen, niet versieren: iedere animatie verwijst naar precies de vraag, formule, code-regel of
    invoerwaarde die de docent op dat moment bespreekt.'
  focus_layout:
    desktop: Linkerpaneel met opgave, rechterpaneel met broncode, daaronder de docentgestuurde vraag + 
      antwoord/hints + trace. Op brede schermen mogen panelen sticky zijn.
    mobile: Paneel van de actieve vraag bovenaan; opgave en code als wisselbare, duidelijk benoemde tabbladen met 
      knop Bekijk relevante coderegel.
    linking_rule: De actieve stap synchroniseert gemarkeerde woorden in opgave, code en optioneel de SVG-figuur. 
      Onbesproken code blijft leesbaar, maar minder prominent.
    no_layout_shift: Zoom via transform/outline op een overlay of binnen vaste containers; geen verspringende 
      tekst, geen verlies van cursor of scrollpositie.
  animation_primitives:
    - id: highlight_text
      purpose: Markeer de exacte frase in de opgave waar de vraag op slaat.
      technique: <mark> of range-highlighting; CSS background en outline
    - id: highlight_code
      purpose: Accentueer relevante Python-tokens of regels, behoud inspringing.
      technique: <span data-code-anchor> met achtergrond en linkeraccent
    - id: zoom_to_fragment
      purpose: Zachte zoom naar een bestaande opgave- of coderegel.
      technique: CSS transform scale(1.00 → max.1.035) binnen geklemde container, 160–240ms
    - id: connect_math_to_code
      purpose: Teken een korte pijl of verbindingslijn tussen wiskundige formule en Python-equivalent.
      technique: Inline SVG path met stroke-dashoffset, alleen bij relevante paren
    - id: trace_value
      purpose: Toon invoerwaarde → tussenberekening → uitkomst stap voor stap.
      technique: Inline tekststappen en begrensde transitions; labels altijd zichtbaar
    - id: spotlight_diagram
      purpose: Isoleer rij, kolom, vlak, grenswaarde of tariefblok in een inline SVG.
      technique: CSS opacity en stroke op specifiek data-shape-id
    - id: indent_guide
      purpose: Laat bij if/elif/else met horizontale gids zien welke regels bij welke tak horen.
      technique: CSS border-inline-start / SVG beugel + tekstlabel voor de conditie
    - id: debug_diff
      purpose: Zet foutieve en herstelde regel naast of onder elkaar en markeer het betekenisvolle verschil.
      technique: Tekstuele diff met betekenislabel; geen rood-groen als enige signaal
  directors_sequence_on_next_step:
    - order: 1
      action: highlight_text
      event: 'Na knop Volgende stap: focus eerst op relevante woorden uit de opgave'
    - order: 2
      action: zoom_to_fragment
      event: Korte, terughoudende zoom naar dezelfde opgavefrase
    - order: 3
      action: show_socratic_question
      event: Vraag wordt getoond; overige details zijn nog niet prijsgegeven
    - order: 4
      action: reveal_optional_hint
      event: Hint 1 en hint 2 uitsluitend na expliciete klik
    - order: 5
      action: highlight_code
      event: Na Toon uitleg markeert de interface de corresponderende code
    - order: 6
      action: trace_value
      event: Systeem toont of visualiseert concreet rekenvoorbeeld en duiding
  control_contract:
    playback: Niet automatisch naar volgende stap. Iedere animatie wordt alleen gestart na een expliciete 
      gebruikershandeling of bij openen van een stap.
    buttons:
      - Vorige stap
      - Volgende stap
      - Toon eerste hint
      - Toon tweede hint
      - Toon uitleg en code
      - Herhaal focus
      - Sla animaties over
      - Toon volledige referentieoplossing
    reduced_motion: 'Respecteer @media (prefers-reduced-motion: reduce) en een zichtbare instelling Animaties uit; toon
      onmiddellijk dezelfde highlights zonder beweging.'
    keyboard: Iedere knop werkt met Enter/Spatie en een zichtbare focus-ring; geen automatische focusverplaatsing 
      bij highlight.
    screen_reader: Wijzigingen in stapnummer en didactische uitleg via beknopte aria-live=polite; geen aria-live 
      voor elke animatieframe.
    time: Focusanimaties maximaal 240 ms per onderdeel, geen knipperen, geen autoplay-lussen en geen 
      scroll-jacking.
    fallback: Met JavaScript uit blijven alle vragen, hints, uitleg, broncode en debugcasussen beschikbaar in 
      semantische HTML of <details>.
    print: Alle animaties worden uitgezet; alle highlights, voorbeelden en uitleg blijven statisch zichtbaar.
  targeting:
    assignment: Verdeel de opgegeven tekst bij de build in veilige tekstnodes; markeer exacte broncitaten als 
      data-problem-anchor zonder in HTML te zoeken met fragiele regex.
    code: Tokeniseer de officiële Python-bron en bewaar oorspronkelijke witruimte. Leg data-code-anchor vast aan 
      exacte substring of unieke regellijst. Als een substring meerdere keren voorkomt, adresseer de bedoelde 
      occurrence of het regelnummer.
    validation: Elk geanimeerd doel moet bestaan. Ontbrekend of dubbelzinnig doel is een buildfout; voeg geen 
      verzonnen tekst toe.
    no_external_libraries: Gebruik uitsluitend CSS, embedded JavaScript en inline SVG; geen GSAP, MathJax, 
      Highlight.js of CDN.
