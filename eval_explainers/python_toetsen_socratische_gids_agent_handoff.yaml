    student_facing_problem:
      editorial_status: faithful Dutch reconstruction of instructions; not verbatim GitHub Markdown
      text_nl: |-
        De opdracht gebruikt de taille-heupverhouding p = tailleomtrek / heupomtrek als vereenvoudigde risicocategorie. Lees het biologische geslacht als letterlijk "man" of "vrouw" en daarna taille en heup in dezelfde eenheid. Toon de verhouding afgerond op twee decimalen. Voor man: laag bij p<0.94, verhoogd bij 0.94≤p≤1.00, sterk verhoogd bij p>1.00. Voor vrouw: laag bij p<0.80, verhoogd bij 0.80≤p≤0.90, sterk verhoogd bij p>0.90. Bij man, taille 95.1 en heup 98.2, verschijnt verhouding 0.97 en verhoogd risico.
      inputs:
        - 'geslacht: "man" of "vrouw"'
        - 'taille: omtrek als float'
        - 'heup: omtrek als float, niet nul'
      algorithm_requirements_nl:
        - Bereken de ongeronde verhouding p = taille/heup.
        - Rond alleen de afdruk van p af op twee decimalen.
        - Selecteer de drempels voor "man" of "vrouw" en vervolgens laag/verhoogd/sterk verhoogd.
        - Vergelijk met de ongeronde p.
    official_reference_solution:
      language: python
      source_kind: verified_public_copy
      code: |
        # Lees de gegevens in
        geslacht = input("Geef je biologische geslacht in (man/vrouw): ")
        taille = float(input("Geef de omtrek van je taille in: "))
        heup = float(input("Geef de omtrek van je heup in: "))

        # verhouding berekenen
        p = taille / heup
        print("Je taille-heup verhouding is:", round(p, 2))

        # selectie
        if geslacht == "man":
            if p < 0.94:
                print("Laag risico op hart- en vaatziekten.")
            elif p <= 1.00:
                print("Verhoogd risico op hart- en vaatziekten.")
            else:
                print("Sterk verhoogd risico op hart- en vaatziekten.")
        else:
            if p < 0.80:
                print("Laag risico op hart- en vaatziekten.")
            elif p <= 0.90:
                print("Verhoogd risico op hart- en vaatziekten.")
            else:
                print("Sterk verhoogd risico op hart- en vaatziekten.")
    source_examples:
