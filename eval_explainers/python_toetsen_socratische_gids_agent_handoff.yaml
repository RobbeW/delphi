    student_facing_problem:
      editorial_status: faithful Dutch reconstruction of instructions; not verbatim GitHub Markdown
      text_nl: |-
        Benader de leeftijd van een hond in mensenjaren volgens een vereenvoudigde regel: het eerste hondenjaar telt voor 15 mensenjaren, het tweede voegt 9 toe (totaal 24), elk volgend jaar voegt 5 toe. Lees de leeftijd van de hond in hele jaren en druk de geschatte leeftijd in mensenjaren af. 1→15, 2→24, 4→34.
      inputs:
        - 'aantal: leeftijd van de hond in gehele jaren, aangenomen vanaf 1'
      algorithm_requirements_nl:
        - 'Bij 1 jaar: leeftijd=15.'
        - 'Bij 2 jaar: leeftijd=24.'
        - 'Bij meer dan 2 jaar: leeftijd=24+(aantal−2)*5.'
    official_reference_solution:
      language: python
      source_kind: verified_public_copy
      code: |
        # Vraag het aantal
        aantal = int(input("Geef het aantal hondenjaren in: "))

        # Leeftijd berekenen
        if  aantal == 1:
            leeftijd = 15
        elif aantal == 2:
            leeftijd = 24
        else:
            leeftijd = 24 + ( aantal - 2 ) * 5

        # Weergave
        print("Deze hond is ongeveer", leeftijd, "mensenjaren oud.")
    source_examples:
