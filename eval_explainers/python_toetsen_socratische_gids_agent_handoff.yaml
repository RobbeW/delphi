# Zelfstandig uitvoerbare YAML handoff: Socratische nabespreking + aandachtsanimaties
# Copyright (c) 2026 Robbe Wulgaert — aiindeklas.be / robbewulgaert.be
# 15 opgaven en officiële referentieoplossingen ongewijzigd; aanvullende uitleg is didactisch geconstrueerd.
# YAML agent handoff — gegenereerd op 2026-11-13
# Opgaven: getrouwe redactionele reconstructie, niet letterlijk gekopieerde Markdown.
# Referentiecode: geverifieerd in een publieke bronkopie; origineel RobbeW-repository gaf 404.
specification:
  id: python-toetsen-interactieve-uitleg-een-html
  title: Python in de Klas — Socratische, geanimeerde toetsnabespreking
  version: 2.0.0
  status: ready_with_provenance_caveat
  purpose: Genereer precies één offline HTML-document met 15 volledige, op bronnen gebaseerde oefenuitleggen. De 
    gids leidt leerlingen met menselijk geformuleerde socratische vragen van de opgavetekst via decompositie, 
    patroonherkenning, wiskundige concepten, programmeerconcepten, leesbaarheid van code en debugging naar de 
    officiële Python-oplossing. De tekst en Python-code worden via toegankelijke aandachtsanimaties samen in beeld 
    gebracht. De bronoplossingen blijven ongewijzigd.
  output_language: nl-BE
  audience:
    primary: Nederlandstalige leerlingen die de oefeningen reeds hebben gemaakt
    level: beginnende programmeurs in het secundair onderwijs
    language_register: helder Standaardnederlands (Vlaanderen), korte actieve zinnen
    assumed_knowledge:
      - input()
      - print()
      - variabelen
      - str
      - int
      - float
      - rekenoperatoren
      - round()
      - math-bibliotheek waar in oefening gebruikt
      - if/elif/else en logische operatoren voor Toets 3
    pedagogical_goal: 'Niet overschrijven of passief consumeren maar beredeneren: opgave ontleden, terugkerende patronen
      zien, de wiskunde als algoritme formuleren, programmeerkeuzes en leesbaarheid beoordelen en fouten systematisch
      opsporen.'
