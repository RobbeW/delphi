    student_facing_problem:
      editorial_status: faithful Dutch reconstruction of instructions; not verbatim GitHub Markdown
      text_nl: |-
        De oefening gebruikt de formule van Leffler om een geschatte lichaamsmassa van een kind te berekenen aan de hand van leeftijd. Vraag leeftijd in maanden. Jonger dan 12 maanden: m=0.5×maanden+4. Vanaf 12 tot en met 120 maanden: m=2×jaren+10, met jaren=maanden/12. Boven 120 maanden toont het programma dat het kind te oud is. Rond een berekende massa af op één decimaal. Voor 1 maand: 4.5 kg; voor 30 maanden: 15.0 kg.
      inputs:
        - 'leeftijd: geheel aantal maanden'
      algorithm_requirements_nl:
        - Als leeftijd<12, gebruik m=0.5*leeftijd+4.
        - Als 12<=leeftijd<=120, reken maanden om naar jaren en gebruik m=2*(leeftijd/12)+10.
        - Als leeftijd>120, toon de melding zonder te berekenen.
        - Rond bij de afdruk op één decimaal.
    official_reference_solution:
      language: python
      source_kind: verified_public_copy
      code: "# Vraag de leeftijd\nleeftijd = int(input(\"Geef de leeftijd in maanden in: \"))\n\n# Lichaamsmassa\nif
        leeftijd < 12:\n    m = 1/2 * leeftijd + 4\n    print(\"De ideale lichaamsmassa is\", round(m, 1), \"kg.\")\n\
        elif leeftijd <= 12*10:\n    leeftijd = leeftijd / 12\n    m = 2 * leeftijd + 10\n    print(\"De ideale lichaamsmassa
        is\", round(m, 1), \"kg.\")\nelse: \n    print(\"Dit kind is te oud om de formule van Leffler te gebruiken.\"\
        )\n"
    source_examples:
