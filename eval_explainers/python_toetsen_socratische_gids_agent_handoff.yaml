    misconceptions:
      - error: Alle blokken aan de prijs van het laatste uur aanrekenen.
        correction: Gebruik voor elk tijdvak afzonderlijk de corresponderende prijs.
      - error: round(minuten/20) gebruiken.
        correction: Er wordt per begonnen blok gerekend; gebruik math.ceil.
      - error: Bij 4 minuten het uitzonderingsbedrag toepassen.
        correction: De uitzondering geldt strikt voor minder dan 4 minuten.
    formative_check:
      question_nl: Welke prijs hoort bij precies 61 minuten?
      answer_nl: €2,00.
      why_nl: ceil(61/20)=4 blokken; eerste 3×0.45 en één extra ×0.65 leveren 2.00.
    visual_brief: Interactieve tariefbalk in blokken van 20 minuten, met visueel totaal dat per uurlaag wordt 
      opgebouwd.
    source_specific_warning: De oorspronkelijke brontekst gebruikt "verontschuldigde" waar "verschuldigde" bedoeld 
      is; schrijf de uitleg correct. De broncode gebruikt een f-string terwijl de eerdere oefeningen vooral 
      print()-argumenten gebruiken; licht de syntax kort toe zonder ze verplicht te stellen. Dit zijn 
      bron-/oefentarieven, niet actuele commerciële prijzen.
    authored_explainer:
      editorial_status: Nieuw vervaardigde didactische uitleg op basis van gecontroleerde broncode; geen originele 
        Dodona-tekst.
      student_introduction:
        teacher_voice_nl: 'Een rit van 35 minuten gebruikt geen 1,75 betaalblokken: je betaalt twee begonnen blokken.
          Hoe bepaal je vervolgens hun tarieven?'
        what_to_notice_nl: Lees het gemarkeerde stukje opgave hardop in gedachten. Wat is gegeven, wat moet het 
          programma uiteindelijk tonen?
        first_reveal: Begin niet met de volledige oplossing; toon eerst het stukje opgave dat de denkvraag uitlokt.
      focus_quote_nl: per begonnen blok van 20 minuten
      method_label_nl: 'Van opgave naar algoritme: denk, ontdek, controleer en debug'
      six_concept_lenses:
        - id: decompositie
          title_nl: Decompositie — ontleed het probleem
          question_nl: Waarom heb je én de ritduur én het aantal betaalblokken nodig?
          reasoning_steps_nl:
            - Het aantal minuten lezen en naar volledige betaalblokken omhoog afronden.
            - Voor ritten korter dan vier minuten de vaste uitzondering toepassen.
            - De betaalblokken verdelen over de opeenvolgende prijslagen.
            - De bedragen per laag optellen en op twee decimalen tonen.
          explanation_nl: 'Je bouwt de oplossing in deze volgorde op: Het aantal minuten lezen en naar volledige betaalblokken
            omhoog afronden. → Voor ritten korter dan vier minuten de vaste uitzondering toepassen. → De betaalblokken
            verdelen over de opeenvolgende prijslagen. → De bedragen per laag optellen en op twee decimalen tonen.'
        - id: patroonherkenning
          title_nl: Patroonherkenning — welke regel keert terug?
          question_nl: Hoeveel blokken passen er per uur en wat herhaalt zich na elke groep van drie?
          explanation_nl: 'Ieder uur bevat drie blokken van twintig minuten. De prijs per blok hangt af van de laag:
            blok 1–3, 4–6, 7–9 en daarna.'
          transfer_nl: 'Vergelijk met Tegels berekenen: snijverlies of begonnen tijdsblokken dwingen dezelfde afronding
            naar boven af.'
        - id: wiskunde
          title_nl: Wiskundige concepten — waarom klopt de berekening?
          question_nl: Waarom is 72 minuten gelijk aan vier betaalblokken en €2.00?
          explanation_nl: ceil(72/20)=4. Eerst drie blokken van €0.45 (=€1.35), dan één van €0.65; samen €2.00.
        - id: programmeren
          title_nl: Programmeerconcepten — hoe drukt Python dit uit?
          question_nl: Waarom moet if minuten < 4 vóór de regels voor de betaalblokken staan?
          explanation_nl: De uitzondering heeft voorrang. Daarna kiest if/elif/else één cumulatieve 
            tariefberekening. math.ceil rondt elk begonnen blok naar boven af.
          syntax_reference: *id015
        - id: leesbaarheid
          title_nl: Leesbaarheid van code — hoe lees je het algoritme?
          question_nl: Wat maakt het verschil tussen het ingesprongen elif-blok voor <=6 en dat voor <=9?
          explanation_nl: Door dezelfde structuur en oplopende grenzen is te zien hoe elke prijsschijf wordt 
            opgeteld. Voeg in een didactische weergave comments en visuele blokverdeling toe; behoud de originele 
            code.
          checklist_nl:
            - Beschrijven de variabelen hun betekenis?
            - Is de code logisch gegroepeerd met witregels en zinvolle commentaren?
            - Zijn de inspringingen correct en tonen ze de programmastructuur?
        - id: debugging
          title_nl: Debugging — welke stap wijkt als eerste af?
          question_nl: Wat betekent "per begonnen blok" voor de vijftiende extra minuut?
          explanation_nl: Vergelijk een bewust foutieve variant met de officiële oplossing. Voorspel eerst de 
            uitkomst, dan pas de foutbron.
      debugging_lab:
        context_nl: Dit is bewust foutieve didactische code, geen regel uit de officiële oplossing.
        buggy_code_nl: 'aantal = int(minuten / 20)  # Fout: naar beneden afronden'
        example_input_nl: 35 minuten
        observed_or_predicted_wrong_nl: 1 blok, €0.45
        correct_result_nl: 2 blokken, €0.90
        investigation_question_nl: Wat betekent "per begonnen blok" voor de vijftiende extra minuut?
        repair_nl: Gebruik math.ceil(minuten / 20).
        checklist_nl:
          - Voorspel de uitvoer vóór je de fout ziet.
          - Bepaal welke tussenwaarde als eerste afwijkt.
          - Koppel die afwijking aan één operator, eenheid, grens of inspringing.
          - Herstel alleen die oorzaak en controleer opnieuw met dezelfde invoer.
        visual_instruction: Markeer met debug_diff exact het afwijkende teken of codefragment; toon een zij-aan-zij
          trace van fout en fix.
      reflective_transfer_nl: 'Vergelijk met Tegels berekenen: snijverlies of begonnen tijdsblokken dwingen dezelfde
        afronding naar boven af.'
      source_caveat_nl: De prijzen gelden uitsluitend binnen de historische oefentekst, niet als actueel 
        Mobit-tarief.
      disclosure_order:
        - opening
