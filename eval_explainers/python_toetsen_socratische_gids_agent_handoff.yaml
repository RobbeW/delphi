    student_facing_problem:
      editorial_status: faithful Dutch reconstruction of instructions; not verbatim GitHub Markdown
      text_nl: |-
        Een fictief didactisch tariefmodel van Mobit rekent per begonnen blok van 20 minuten. Blokken 1–3 (eerste uur) kosten €0,45 per blok; blokken 4–6 kosten €0,65; blokken 7–9 kosten €0,80; alle volgende blokken kosten €1,00. Ritten korter dan vier minuten zijn een uitzondering: €0,29. Lees het aantal minuten en bereken de volledige ritprijs met cumulatieve bloktarieven, afgerond op twee decimalen. Bij 35 minuten betaalt de gebruiker €0,90; bij 72 minuten €2,00.
      inputs:
        - 'minuten: geheel aantal fietsminuten'
      algorithm_requirements_nl:
        - Eerst aantal begonnen blokken = ceil(minuten/20).
        - Ritten korter dan 4 minuten kosten altijd 0.29.
        - Voor het overige bereken je de prijs per categorie cumulatief voor 1–3, 4–6, 7–9 en 10+ blokken.
        - Rond alleen het eindtotaal op twee decimalen af.
    official_reference_solution:
      language: python
      source_kind: verified_public_copy
      code: |
        import math
        # Vraag de gebruiker naar het aantal minuten
        minuten = int(input("Geef het aantal minuten dat je fietste in: "))

        # Aantal blokken
        aantal = math.ceil(minuten / 20)

        # Kostprijs bepalen
        if minuten < 4:
            kost = 0.29
        elif aantal <= 3:
            kost = aantal * 0.45
        elif aantal <= 6:
            kost = 3 * 0.45 + (aantal - 3) * 0.65
        elif aantal <= 9:
            kost = 3 * 0.45 + 3 * 0.65 + (aantal - 6) * 0.80
        else:
            kost = 3 * 0.45 + 3 * 0.65 + 3 * 0.80 + (aantal - 9) * 1.00

        # Uitvoer
        print(f"Kostprijs: € {round(kost, 2)}")
