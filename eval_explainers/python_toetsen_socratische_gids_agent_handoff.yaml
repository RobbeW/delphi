        - 'b: tweede zijde (geheel getal)'
        - 'c: derde zijde (geheel getal)'
      algorithm_requirements_nl:
        - Controleer a+b>c, b+c>a en a+c>b.
        - Combineer alle drie voorwaarden met and.
        - Schrijf de bijbehorende zin vanuit if/else.
    official_reference_solution:
      language: python
      source_kind: verified_public_copy
      code: |
        # Lees de zijden in
        a = int( input( "Geef de eerste zijde in: " ) )
        b = int( input( "Geef de tweede zijde in: " ) )
        c = int( input( "Geef de derde zijde in: " ) )

        ## onderzoek
        if( a + b > c and b + c > a and a + c > b):
            print( 'Deze zijden vormen een driehoek.' )
        else:
            print( 'Deze zijden vormen geen driehoek.' )
