      text_nl: |-
        Gegeven drie zijden a, b en c: ze vormen uitsluitend een driehoek als de som van iedere combinatie van twee zijden strikt groter is dan de derde zijde. Vraag de drie gehele lengtes en geef aan of de zijden een driehoek vormen. 4,7,2 vormt geen driehoek; 4,5,2 wel.
      inputs:
