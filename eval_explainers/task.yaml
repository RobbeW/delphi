stop_conditions:
- 'Missing required key, unresolved source contradiction, failing Python example or ambiguous/missing focus anchor:
  stop affected build and escalate; do not invent or silently repair.'
- 'Unavailable model, required browser capability or evidence: report exact limitation; no false pass or silent
  fallback.'
- Stop for protected-policy or scope changes, external publication or material original-source differences.
final_handback: 'At most 400 words: changed files, checks and actual outcomes, remaining risks and blockers. Never
  claim unrun checks passed.'
implementation_status: complete
product_contract:
  language: nl-BE; clear age-appropriate Flemish Standard Dutch, active teacher voice, no generic praise.
  document:
    doctype: <!doctype html>
    charset: UTF-8
    viewport: width=device-width, initial-scale=1
    lang: nl-BE
    title: Python — Toetsen stap voor stap
    stylesheet: een ingebedde <style>
    script: een ingebedde <script> voor enhancement; offline
  entry: Three test indexes with exercise anchors; no mandatory splash, quiz or modal. Start with problem and opening
    question; reference code collapsed until explicit reveal.
  desktop: Linked problem and code panels; teacher question/hints/explanation and concrete trace below. Restrained
    system fonts, readable maximum width about 900px; broad-screen sticky panels only where useful.
  mobile: Active question first, clearly labelled problem/code tabs and Bekijk relevante coderegel control. Do not
    expose unrevealed code through tab navigation.
  stage_controls:
  - Vorige stap
  - Volgende stap
  - Toon eerste hint
  - Toon tweede hint
  - Toon uitleg en code
  - Herhaal focus
  - Sla animaties over
  - Toon volledige referentieoplossing
  other_controls:
  - Previous/next exercise
  - Expand/collapse exercise details
  - Reset current exercise reveal state only
  - Non-graded formative self-check with accessible answer
  state: One active stage per exercise; stage X/Y. In-memory reveal state; no need for persistence. If persistence
    is introduced, justify it, keep it optional and fail gracefully.
  animation_primitives:
  - highlight_text
  - highlight_code
  - zoom_to_fragment
  - connect_math_to_code
  - trace_value
  - spotlight_diagram
  - indent_guide
  - debug_diff
  accessibility: Semantic native controls, visible focus, meaningful SVG descriptions, WCAG AA text contrast, no
    color-only meaning. Brief polite live updates, no forced focus or scroll movement. Keyboard/mobile tabs must
    have appropriate semantics.
  fallbacks: All questions, both hints, explanations, full code, diagrams, traces, debugging cases and source provenance
    must be readable without JavaScript. Print exposes closed details and inactive stages; no animation transforms.
  privacy: No accounts, analytics, cookies, server storage or real pupil/medical data. Use supplied/synthetic fixtures.
    No embedded Dodona tokens or configuration internals.
  provenance_footer: Credit Robbe Wulgaert — aiindeklas.be / robbewulgaert.be; identify public copy, pinned commit,
    reconstructed statements and unverified original equivalence. Citation hyperlinks are allowed but never fetched
    automatically.
  offline: Open directly through file://. Inline all markup, CSS, JS and SVG; no fetch, external assets, fonts,
    CDNs, frameworks, Python runtime or service-worker dependency. Authoring/test helpers are not shipped or required
    to read the guide.
